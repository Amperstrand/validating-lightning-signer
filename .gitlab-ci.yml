image: python:3.14

cache:
  key: vls-global
  paths:
    - bin

variables:
  # Full clone. vls-util/build.rs derives GIT_DESC from `git describe --match=v*.*`,
  # and the tests in vls-proxy/src/socket_main.rs assert it looks like a version.
  # Under the runner's default shallow fetch the tag is not reachable from an
  # MR ref, and describe's --always flag then degrades silently to a bare SHA,
  # which surfaces as a confusing test failure rather than a build error.
  # Measured cost of the full clone over depth 50: ~9MB, no measurable wall clock.
  GIT_DEPTH: 0
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  VLS_REPOSITORY: https://gitlab.com/lightning-signer/validating-lightning-signer.git
  VLS_REGISTRY: registry.gitlab.com/lightning-signer/validating-lightning-signer
  RUST_QEMU_NIGHTLY_VERSION: "nightly-1-95-2026-02-26"
  RUNNER_TAG: "saas-linux-large-amd64"

# Shared rules applied to every build/test job so they are skipped on the
# Renovate *scan* pipeline (the scheduled run that only executes the `renovate`
# job). The dependency-update merge requests Renovate opens are ordinary MRs and
# still run the full matrix via the workflow rules below.
.skip_on_renovate: &skip_on_renovate
  - if: '$RENOVATE_SCHEDULE == "true"'
    when: never
  - when: on_success

workflow:
  rules:
    # If the CI_PROJECT_NAMESPACE does not contain 'lightning-signer' (e.g., external MRs or forks),
    # set the RUNNER_TAG variable to use a saas-linux-medium-amd64 runner instead of the default saas-linux-large-amd64.
    - if: '$CI_PROJECT_NAMESPACE !~ /lightning-signer/'
      variables:
        RUNNER_TAG: "saas-linux-medium-amd64"
    # Renovate scan pipeline: allow it to run. Only the `renovate` job executes here;
    # every other job is gated off via *skip_on_renovate.
    - if: '$RENOVATE_SCHEDULE == "true"'
      when: always
    - if: '$CI_MERGE_REQUEST_ID || $CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

before_script:
  # Always fetch from upstream to ensure tags are available (handles forks which don't sync tags)
  - git fetch "$VLS_REPOSITORY" --tags --force
  - ls -al
  - mkdir -p bin

stages:
  - build
  - test

include:
  - template: Coverage-Fuzzing.gitlab-ci.yml

# Do this in a separate job, so that it gets cached with high probability
# later jobs can be flaky and cache is not written when a job fails.
get-bitcoin:
  stage: build
  rules: *skip_on_renovate
  cache:
    key: vls-bitcoin
    paths:
      - bin
  script:
    - ls -l bin
    - if [ ! -e bin/bitcoind ]; then
      wget --no-verbose https://bitcoincore.org/bin/bitcoin-core-29.2/bitcoin-29.2-x86_64-linux-gnu.tar.gz &&
      echo 1fd58d0ae94b8a9e21bbaeab7d53395a44976e82bd5492b0a894826c135f9009  bitcoin-29.2-x86_64-linux-gnu.tar.gz | sha256sum -c &&
      tar xzf bitcoin-29.2-x86_64-linux-gnu.tar.gz &&
      mv bitcoin-29.2/bin/bitcoind bin/ &&
      rm -rf bitcoin-29.2 ;
      fi
  artifacts:
    paths:
      - bin/bitcoind
    expire_in: 1 week

fuzz-channel:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  image: 'rustlang/rust:nightly'
  extends: .fuzz_base
  stage: test
  cache:
    key: vls-fuzz
    paths:
      - .cache/cargo
  needs:
    - rust-msrv
  timeout: 90m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 80m
    COVFUZZ_USE_REGISTRY: "true"
    COVFUZZ_CORPUS_NAME: "channel"
  script:
    - export RUSTFLAGS="-Zallow-features=proc_macro_span"
    - cargo install cargo-fuzz || echo "cargo-fuzz install failed, likely due to licensing; continuing anyway"
    - cargo fuzz run channel -- -runs=0 || echo "Fuzzing skipped due to missing license or setup"
    - ./gitlab-cov-fuzz run --regression=$REGRESSION -- ./fuzz/target/x86_64-unknown-linux-gnu/release/channel || echo "gitlab-cov-fuzz not available; skipping"

random-scheduler:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: test
  needs: [ "rust-latest" ]
  image: rust:latest
  timeout: 5m
  cache:
    key: vls-random-scheduler
    paths:
      - .cache/cargo
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cargo test --features shuttle shuttle_tests

rust-latest:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  needs: [ "get-bitcoin" ]
  cache:
    key: vls-compile-latest
    paths:
      - bin
      - .cache/cargo
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    # check if Cargo.lock is upto date
    - cargo update -w --locked
    # build command line binaries for integration tests
    - cargo build --bins
    - cargo test
    # ensure vls-persist builds with no-std
    - cargo build -p vls-persist --no-default-features --features no-std,kvv
    # run tests for otlp and observability crate
    - cargo test --package vls-proxy --lib --all-features -- util
    # ensure benches build
    - cargo bench --no-run
    # ensure vls crates build without developer flag
    - cargo build --release
    # build vlsd for integration tests
    - cargo build  --bin vlsd --features developer
    # build lnrod for integration tests
    - cd lnrod && cargo build
  artifacts:
    paths:
      - "target/debug/vlsd"
      - "target/debug/vls-cli"
      - "lnrod/target/debug/lnrod"

rust-latest-extras:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  services:
    - docker:26.0.1-dind
  cache:
    key: vls-compile-latest-extras
    paths:
      - bin
      - .cache/cargo
  variables:
    DB_HOST: docker
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # gitlab doesn't know how to wait for a service start https://gitlab.com/gitlab-org/gitlab/-/issues/24197
    - sleep 60;
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cd lightning-storage-server
    - cargo update -w --locked
    - cargo build --all-features
    - cargo test
  artifacts:
    paths:
      - "target"

rust-msrv:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: build
  image: rust:1.85.0
  cache:
    key: vls-compile-1_85
    paths:
      - bin
      - .cache/cargo
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    # build command line binaries for integration tests
    - cargo build --bins
    - cargo test --features test_cli

rust-msrv-lss:
  tags: [$RUNNER_TAG]
  rules: *skip_on_renovate
  stage: build
  image: rust:1.85.0
  cache:
    key: vls-compile-lss-1_85
    paths:
      - bin
      - .cache/cargo
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    # only lss library should be msrv compatible
    - cd lightning-storage-server
    - cargo test -p lightning-storage-server

embedded:
  tags: [ saas-linux-medium-amd64 ]
  rules: *skip_on_renovate
  stage: build
  image: $VLS_REGISTRY/rust-qemu:$RUST_QEMU_NIGHTLY_VERSION
  cache:
    key: vls-embedded
    paths:
      - .cache/cargo
  variables:
    RUSTFLAGS: "-C link-arg=-Tlink.x"
    CARGO_TARGET_THUMBV7M_NONE_EABI_RUNNER: "qemu-system-arm -cpu cortex-m3 -machine mps2-an385 -nographic -semihosting-config enable=on,target=native -kernel"
  script:
    - cd embedded
    - cargo update -w --locked
    - cargo run --release --target thumbv7m-none-eabi

stm32:
  tags: [ saas-linux-medium-amd64 ]
  rules: *skip_on_renovate
  stage: build
  image: $VLS_REGISTRY/rust-qemu:$RUST_QEMU_NIGHTLY_VERSION
  cache:
    key: vls-stm32
    paths:
      - .cache/cargo
  script:
    - cd vls-signer-stm32
    - cargo update -w --locked
    - cargo build --features developer --release --bin demo_signer

wasm:
  tags: [ saas-linux-medium-amd64 ]
  rules: *skip_on_renovate
  stage: build
  image: $VLS_REGISTRY/rust-qemu:$RUST_QEMU_NIGHTLY_VERSION
  cache:
    key: vls-wasm
    paths:
      - .cache/cargo
      - wasm/target
  script:
    - cd wasm
    - cargo update -w --locked
    - wasm-pack test --firefox --headless && cargo test

coverage:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  needs: [ "get-bitcoin" ]
  cache:
    key: vls-coverage
    paths:
      - .cache/cargo
  coverage: '/^LINE_COVERAGE: \d+.\d+$/'
  script:
    - rustup show
    - cargo install cargo-llvm-cov
    - apt-get update
    - apt-get install -y protobuf-compiler
    - apt-get install -y jq
    - bin/bitcoind --regtest --daemon --rpcuser=user --rpcpassword=pass
    - (cd lightning-storage-server && cargo build --bin lssd && cargo run --bin lssd &)
    - sleep 2
    - ./scripts/run-llvm-cov --features system-test
    - bash <(curl -s https://codecov.io/bash) -f target/codecov.json -t "${CODECOV_TOKEN}"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/cobertura.xml
    expire_in: 1 week

# Dependency checks are split by whether their verdict can change while the code
# stands still.
#
# bans/licenses/sources are a pure function of the lockfile, so they gate MRs.
#
# advisories (and cargo audit) also depend on the RustSec database, which moves
# underneath us: a newly published advisory against a crate already in the lock
# would otherwise turn every unrelated MR red, and stay red for as long as
# renovate.json's minimumReleaseAge holds the fix back -- or indefinitely, when
# no fixed version exists yet. So on MRs they only warn, and the authoritative
# run is the daily scheduled pipeline (the same one that runs `renovate`), where
# a failure is a signal rather than noise. Triage there: take the Renovate bump
# if one is open, otherwise add a deny.toml ignore with a reason.
# Workspaces listed in the root Cargo.toml `exclude` (lss, lnrod, wasm,
# embedded, stm32) have their own lockfiles and are invisible to a root
# `cargo deny`, so each is checked explicitly. This replaces the previous
# `cargo audit` runs over lss/lnrod: cargo-deny covers the same RustSec data,
# also flags yanked crates, and shares deny.toml's ignore list, so a triage
# decision is recorded in one place for the whole repo.
#
# cargo-deny is version-pinned: --config moved to a root flag in 0.20 and
# changed how it resolves relative paths in 0.19, so an unpinned `cargo install`
# silently changes the required argument order. Note also that a --config path
# that does not resolve falls back to the built-in default config, which allows
# no licenses at all -- it warns once and then reports every crate as rejected.
.deny_excluded_workspaces: &deny_excluded_workspaces |
  fail=0
  for d in lightning-storage-server lnrod wasm embedded vls-signer-stm32; do
    echo "--- cargo deny $DENY_CHECKS: $d"
    cargo deny --config "$CI_PROJECT_DIR/deny.toml" \
      --manifest-path "$d/Cargo.toml" check $DENY_CHECKS || fail=1
  done
  exit $fail

cargo-deny:
  tags: [ saas-linux-medium-amd64 ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  cache:
    key: vls-audit
    paths:
      - .cache/cargo
  variables:
    DENY_CHECKS: "bans licenses sources"
  script:
    - cargo install cargo-deny --locked --version 0.20.2
    - cargo deny check bans licenses sources
    - *deny_excluded_workspaces

cargo-advisories:
  tags: [ saas-linux-medium-amd64 ]
  # Deliberately not *skip_on_renovate: this job is the point of the scheduled
  # pipeline's second half, so it must run there -- and only there does it fail
  # the pipeline.
  rules:
    - if: '$RENOVATE_SCHEDULE == "true"'
      allow_failure: false
    - when: on_success
      allow_failure: true
  stage: build
  image: rust:latest
  cache:
    key: vls-audit
    paths:
      - .cache/cargo
  variables:
    DENY_CHECKS: "advisories"
  script:
    - cargo install cargo-deny --locked --version 0.20.2
    - cargo deny check advisories
    - *deny_excluded_workspaces

changelog:
  stage: build
  rules: *skip_on_renovate
  before_script:
    - git fetch origin main:main
  allow_failure: true
  script:
    - |
      if [ "$(git cat-file -p $CI_COMMIT_SHA | grep -c 'parent')" -gt 1 ]; then
        echo "This is a merge commit, don't require a changelog entry"
      elif [[ "$CI_COMMIT_REF_NAME" =~ release ]]; then
        echo "This is a release branch, don't require a changelog entry"
      else
        echo "This is not a merge commit."
        if git log 'main..HEAD' --pretty="%s%x09%b" | grep -q -E 'Changelog-(\S*): (.*)$'; then
          echo "Changelog commit message found.";
        else
          echo "Error: No Changelog commit message found.";
          exit 1;
        fi
      fi

lints:
  tags: [ $RUNNER_TAG ]
  stage: build
  image: rust:latest
  cache:
    key: vls-lints
    paths:
      - .cache/cargo
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    # Main workspace: default features, then features other jobs exercise.
    # No --all-features here because vls-core's std and no-std features don't coexist.
    - cargo check --workspace --all-targets
    - cargo check --workspace --all-targets --features vls-proxy/developer,vls-proxy/test_cli,vls-core/shuttle,vls-proxy/system-test
    # Excluded crates (each is its own workspace).
    - (cd lnrod && cargo check --workspace --all-targets --all-features)
    - (cd lightning-storage-server && cargo check --workspace --all-targets --all-features)
    - (cd wasm && cargo check --all-targets --all-features)
    # embedded host build only; device build needs nightly and a thumb target (covered by the embedded job).
    - (cd embedded && cargo check --no-default-features --features std --all-targets)

cargo-fmt:
  tags: [ saas-linux-small-amd64 ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  cache:
    key: vls-fmt
    paths:
      - .cache/rustup
      - .cache/cargo
  variables:
    RUSTUP_HOME: "$CI_PROJECT_DIR/.cache/rustup"
  script:
    # rustup otherwise searches for its own binary in CARGO_HOME which fails
    - rustup set auto-self-update disable
    - rustup toolchain install nightly-2026-02-26
    - rustup component add --toolchain nightly-2026-02-26 rustfmt
    - ./scripts/fmt-all --check

cargo-mutants:
  tags: [ $RUNNER_TAG ]
  rules: *skip_on_renovate
  stage: build
  image: rust:latest
  needs: [ "get-bitcoin" ]
  cache:
    key: vls-mutants
    paths:
      - .cache/cargo
  script:
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cargo install cargo-mutants
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Running cargo-mutants incrementally for main branch"
        git fetch origin main
        git diff HEAD^ HEAD > git.diff
        cargo mutants --in-diff git.diff --package vls-core -vV
      else
        echo "Running cargo-mutants incrementally for non-main branch"
        git fetch origin main
        git diff origin/main > git.diff
        cargo mutants --in-diff git.diff --package vls-core -vV
      fi
  artifacts:
    when: always
    paths:
      - mutants.out/
    expire_in: 1 week

integration-lnrod-local:
  stage: test
  rules: *skip_on_renovate
  tags: [ $RUNNER_TAG ]
  needs: [ "rust-latest", "get-bitcoin" ]
  script:
    - export PATH="$PATH:`pwd`/bin"
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cd lnrod
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./scripts/compile-proto
    - SIGNER=vls-local ./tests/integration-test.py
  artifacts:
    when: always
    paths:
      - test-output

integration-lnrod-grpc:
  stage: test
  rules: *skip_on_renovate
  tags: [ $RUNNER_TAG ]
  needs: [ "rust-latest", "get-bitcoin" ]
  script:
    - export PATH="$PATH:`pwd`/bin"
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cd lnrod
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./scripts/compile-proto
    - SIGNER=vls-grpc  ./tests/integration-test.py
  artifacts:
    when: always
    paths:
      - lnrod/test-output

integration-lnrod-grpc-disaster-recovery:
  stage: test
  rules: *skip_on_renovate
  tags: [ $RUNNER_TAG ]
  needs: [ "rust-latest", "get-bitcoin" ]
  script:
    - export PATH="$PATH:`pwd`/bin"
    - apt-get update
    - apt-get install -y protobuf-compiler
    - cd lnrod
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./scripts/compile-proto
    - SIGNER=vls-grpc  ./tests/integration-test.py --test-disaster bitcoind
  artifacts:
    when: always
    paths:
      - lnrod/test-output

# ---------------------------------------------------------------------------
# Self-hosted Renovate (replaces the Mend GitLab app). Invariants to keep:
#
# - This job is gated on RENOVATE_SCHEDULE=true, the same flag *skip_on_renovate
#   uses to skip the matrix. The two MUST stay in sync: set it on the pipeline
#   schedule (and nowhere else) so the scan runs alone and the bumps it opens
#   still get the full matrix as ordinary MRs.
# - Cadence lives in renovate.json, not in the cron. The schedule must fire more
#   often than any renovate.json window (run it DAILY), or the "at any time"
#   vuln fast-path and the monthly lockFileMaintenance sweep get starved.
# - Requires a masked RENOVATE_TOKEN CI/CD variable (bot token, scopes:
#   api, read_user, write_repository). Without it the job no-ops/fails.
# ---------------------------------------------------------------------------
renovate:
  stage: build
  image:
    name: renovate/renovate:43
    entrypoint: [""]
  tags: [ saas-linux-medium-amd64 ]
  before_script: []
  cache: {}
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    LOG_LEVEL: info
  rules:
    - if: '$RENOVATE_SCHEDULE == "true"'
  script:
    - renovate "$CI_PROJECT_PATH"
