name: gitleaks

# First CI workflow for this repo — secret-scan backstop to the
# hooks/pre-commit prevention layer (same pattern as the estate:
# tollgate-module-basic-go #107/#108, PRTA #22).
# PR -> new commits only; push to main -> pushed range; weekly -> full history.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "09 5 * * 1"

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          CONFIG=""
          [ -f .gitleaks.toml ] && CONFIG="--config .gitleaks.toml"
          RANGE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -n "${BASE:-}" ] && git cat-file -e "$BASE" 2>/dev/null; then
            echo "scanning new commits only: $BASE..HEAD"
            gitleaks git . --redact --verbose $CONFIG --log-opts="$BASE..HEAD"
          else
            echo "no resolvable base — scanning full history"
            gitleaks git . --redact --verbose $CONFIG
          fi
